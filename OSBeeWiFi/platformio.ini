[platformio]
src_dir = .
include_dir = .

[env:d1_mini]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
extra_scripts = pre:run_prebuild.py
lib_ldf_mode = deep
lib_deps =
    https://github.com/ThingPulse/esp8266-oled-ssd1306/archive/refs/tags/4.2.1.zip
    https://github.com/blynkkk/blynk-library/archive/refs/tags/v1.0.1.zip
    https://github.com/OpenThingsIO/OpenThings-Framework-Firmware-Library @ ^0.2.0
monitor_speed=115200
board_build.flash_mode = dio
upload_speed = 460800
board_build.ldscript = eagle.flash.4m2m.ld
upload_resetmethod = nodemcu